on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('**/uv.lock') }}
      - run: uv sync --all-groups --frozen
      - run: uv run --no-sync prek run --all-files
      - run: cargo check
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: uv run --with maturin maturin develop
      - run: uv run --no-sync pytest -q tests/test_smoke.py
      - run: uv build --wheel --no-sources
      - run: |
          python -m venv .wheel-smoke
          . .wheel-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/remerge_mwe-*.whl
          python -c "import remerge; assert callable(remerge.run); assert remerge.run(['a b'], 1, method='frequency')[0].merged_lexeme.word == ('a', 'b')"
      - run: uv run --no-sync pytest -v -m "not performance" --cov=src/remerge --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  performance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('**/uv.lock') }}
      - run: uv sync --all-groups --frozen
      - run: uv run --with maturin maturin develop
      - run: REMERGE_PERF_GUARD=1 REMERGE_PERF_ITERATIONS=5 REMERGE_PERF_MAX_SECONDS=25.0 uv run --no-sync pytest -q tests/performance/test_runtime.py
