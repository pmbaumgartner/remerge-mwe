minimum_prek_version = "0.4.10"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --no-sync ruff format"
files = "^(src|tests|tools|packages/remerge-pos)/.*\\.pyi?$"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run --no-sync ruff check"
files = "^(src|tests|tools|packages/remerge-pos)/.*\\.pyi?$"

[[repos.hooks]]
id = "ty-check"
name = "ty check"
language = "system"
entry = "uv run --no-sync ty check src tests tools packages/remerge-pos/src packages/remerge-pos/tests"
files = "^((src|tests|tools|packages/remerge-pos)/.*\\.pyi?|pyproject\\.toml)$"
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets -- -D warnings"
files = "^(rust/.*\\.rs|Cargo\\.(toml|lock))$"
pass_filenames = false
